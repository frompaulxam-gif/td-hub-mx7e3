<!doctype html>
<html lang="en" data-venue="merchants-yard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>TDG Hub</title>
<link rel="stylesheet" href="app.css?v=25">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='4' y='4' width='56' height='56' rx='14' fill='%23211a12'/><circle cx='32' cy='32' r='9' fill='%232e6b38'/></svg>">
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <div class="wordmark">Hub</div>
    <div class="venue-switch" role="tablist" aria-label="Venue">
      <span class="venue-thumb" aria-hidden="true"></span>
      <button class="venue-btn" role="tab" data-venue-btn="merchants-yard">Merchants Yard</button>
      <button class="venue-btn" role="tab" data-venue-btn="moonshine">Moonshine</button>
    </div>
    <div class="view-switch" role="tablist" aria-label="View">
      <button class="view-btn is-on" role="tab" data-view-btn="board">Board</button>
      <button class="view-btn" role="tab" data-view-btn="calendar">Calendar</button>
    </div>
  </div>
  <div class="topbar-row week-row">
    <button class="week-nav" id="week-prev" aria-label="Previous week">&#8249;</button>
    <div class="week-label" id="week-label">&nbsp;</div>
    <button class="week-nav" id="week-next" aria-label="Next week">&#8250;</button>
    <div class="week-progress" id="week-progress"></div>
    <button class="mini-btn" id="week-download" hidden>Download week</button>
    <span class="ro-pill" id="ro-pill" hidden>read only</span>
  </div>
</header>

<main id="main">
  <div id="keydates" class="keydates" hidden></div>
  <div id="links" class="links-row" hidden></div>
  <section id="board" aria-label="Week overview">
    <div class="sec-head">
      <span class="sec-title">Overview</span>
      <button class="collapse-btn" data-collapse="board" aria-label="Collapse overview">&#8964;</button>
    </div>
    <div id="board-body">
      <div class="board-head" id="board-head" hidden>
        <div></div><div class="board-col-label">Grid post</div><div class="board-col-label">Story</div>
      </div>
      <div id="board-rows"></div>
    </div>
  </section>
  <section id="prep" aria-label="Prep for the week" hidden>
    <div class="sec-head">
      <span class="prep-head">Before the week</span>
      <button class="collapse-btn" data-collapse="prep" aria-label="Collapse prep">&#8964;</button>
    </div>
    <div id="prep-body"><ul class="xchecklist" id="prep-list"></ul></div>
  </section>
  <section id="expanded" aria-label="Day by day review"></section>
  <section id="calendar" class="calendar" hidden></section>
  <div id="empty" class="empty" hidden>
    <div class="empty-art" aria-hidden="true"></div>
    <p id="empty-text">No weeks here yet.</p>
  </div>
</main>

<div id="editor" class="editor" hidden>
  <div class="editor-bar">
    <button class="mini-btn editor-cancel" id="editor-cancel">Cancel</button>
    <span class="editor-hint" id="editor-hint">Drag any text block. Tap one to restyle it.</span>
    <div class="editor-size" id="editor-size" hidden>
      <span class="ed-ctl-label">Text</span>
      <button class="icon-btn" id="size-down" aria-label="Smaller text">&#8722;</button>
      <span id="size-val"></span>
      <button class="icon-btn" id="size-up" aria-label="Bigger text">&#43;</button>
      <span class="ed-ctl-label">Width</span>
      <button class="icon-btn" id="width-down" aria-label="Narrower">&#8722;</button>
      <button class="icon-btn" id="width-up" aria-label="Wider">&#43;</button>
      <button class="mini-btn" id="center-block">Centre</button>
      <select id="font-select" aria-label="Font"></select>
      <textarea id="text-edit" rows="1" placeholder="Edit the text" aria-label="Edit block text"></textarea>
    </div>
    <button class="mini-btn editor-save" id="editor-save">Save &amp; re-render</button>
  </div>
  <div class="editor-stage-wrap"><div class="editor-stage" id="editor-stage"></div></div>
</div>

<div id="photo-picker" class="photo-picker" hidden>
  <div class="picker-card">
    <div class="picker-head">
      <span class="picker-title">Change photo</span>
      <button class="icon-btn" id="picker-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="picker-grid" id="picker-grid"></div>
  </div>
</div>

<div id="gallery" class="photo-picker" hidden>
  <div class="picker-card gallery-card">
    <div class="picker-head">
      <span class="picker-title" id="gallery-title">All options</span>
      <span class="gallery-count" id="gallery-count"></span>
      <button class="icon-btn" id="gallery-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>
</div>

<button id="refresh-btn" title="Refresh (keeps your place)" aria-label="Refresh">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M20 11a8 8 0 1 0-.6 4"/><path d="M20 4v7h-7"/>
  </svg>
</button>

<div class="toast" id="toast" role="status"></div>
<script src="app.js?v=25"></script>
</body>
</html>
