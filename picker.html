<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Choose slides</title>
<style>
  /* deliberately self-contained: no shared stylesheet, nothing can collapse these tiles */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 15px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; background: #f6f4f1; color: #211a12; }
  header {
    position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 2px solid #211a12;
    padding: 14px 22px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 18px; font-weight: 800; }
  .count { color: #6b6259; font-size: 14px; }
  .spacer { flex: 1; }
  button.act {
    font: inherit; font-weight: 700; cursor: pointer; border: 2px solid #211a12;
    background: #fff; color: #211a12; padding: 7px 14px;
  }
  button.act:hover { background: #211a12; color: #fff; }
  #grid {
    display: flex; flex-wrap: wrap; gap: 22px; padding: 22px;
    align-items: flex-start;
  }
  /* fixed pixel box on purpose: no %, no vw, no aspect-ratio.
     nothing about the viewport or image load order can collapse these. */
  .card { width: 360px; }
  .frame {
    position: relative; width: 360px; height: 450px;
    background: #17120e; border: 4px solid transparent; cursor: pointer;
  }
  .card.kept .frame { border-color: #2e6b38; }
  .frame img { display: block; width: 352px; height: 442px; object-fit: contain; }
  .tag {
    position: absolute; left: 8px; top: 8px; padding: 4px 10px;
    font-size: 13px; font-weight: 800; background: rgba(0,0,0,.62); color: #fff;
  }
  .card.kept .tag { background: #2e6b38; }
  .line { padding: 8px 2px 0; font-size: 13px; color: #4a423a; word-break: break-word; }
  #empty { padding: 40px 22px; color: #6b6259; }
  @media (max-width: 820px) {
    .card, .frame { width: 320px; }
    .frame { height: 400px; }
    .frame img { width: 312px; height: 392px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Choose slides</h1>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <button class="act" id="clear">Clear all</button>
  <button class="act" id="close">Done</button>
</header>
<div id="grid"></div>
<div id="empty" hidden>Nothing to show. Open this from a post that has candidates.</div>

<script>
const qs = new URLSearchParams(location.search);
const VENUE = qs.get("venue"), WEEK = qs.get("week"), ID = qs.get("id");
let slot = null, weekObj = null;

const mediaUrl = p => "/media/" + VENUE + "/" + WEEK + "/" + p.split("/").map(encodeURIComponent).join("/");
const label = p => p.split("/").pop().replace(/^\d+-/, "").replace(/\.[a-z0-9]+$/i, "").replace(/-/g, " ");

async function load() {
  const r = await fetch("/api/weeks?venue=" + VENUE);
  const j = await r.json();
  weekObj = j.weeks.find(w => w.week_start === WEEK);
  slot = weekObj && weekObj.slots.find(s => s.id === ID);
  if (!slot || !(slot.candidates || []).length) {
    document.getElementById("empty").hidden = false;
    return;
  }
  document.getElementById("title").textContent = slot.title || slot.slot;
  render();
}

function render() {
  const kept = slot.media || [];
  document.getElementById("count").textContent =
    kept.length + " in the carousel, " + slot.candidates.length + " to choose from";
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const path of slot.candidates) {
    const i = kept.indexOf(path);
    const card = document.createElement("div");
    card.className = "card" + (i >= 0 ? " kept" : "");

    const frame = document.createElement("div");
    frame.className = "frame";
    const img = document.createElement("img");
    img.src = mediaUrl(path);
    img.alt = "";
    frame.appendChild(img);
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = i >= 0 ? String(i + 1) : "out";
    frame.appendChild(tag);
    frame.addEventListener("click", () => toggle(path));
    card.appendChild(frame);

    const line = document.createElement("div");
    line.className = "line";
    line.textContent = label(path);
    card.appendChild(line);
    grid.appendChild(card);
  }
}

async function save(next) {
  const r = await fetch("/api/slot", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ venue: VENUE, week_start: WEEK, id: ID, set: { media: next } }),
  });
  const j = await r.json();
  if (j.ok) { slot.media = j.slot.media; render(); }
  else alert("Save failed: " + (j.error || "unknown"));
}

function toggle(path) {
  const kept = slot.media || [];
  save(kept.includes(path) ? kept.filter(p => p !== path) : [...kept, path]);
}

document.getElementById("clear").addEventListener("click", () => {
  if (confirm("Remove all slides from the carousel?")) save([]);
});
document.getElementById("close").addEventListener("click", () => {
  if (history.length > 1) history.back(); else close();
});
load();
</script>
</body>
</html>
