<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Choose slides</title>
<style>
  /* deliberately self-contained: no shared stylesheet, nothing can collapse these tiles */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body { font: 15px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; background: #f6f4f1; color: #211a12; }
  header {
    position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 2px solid #211a12;
    padding: 14px 22px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 18px; font-weight: 800; }
  .count { color: #6b6259; font-size: 14px; }
  .spacer { flex: 1; }
  button.act {
    font: inherit; font-weight: 700; cursor: pointer; border: 2px solid #211a12;
    background: #fff; color: #211a12; padding: 7px 14px;
  }
  button.act:hover { background: #211a12; color: #fff; }
  #grid {
    display: flex; flex-wrap: wrap; gap: 22px; padding: 22px;
    align-items: flex-start;
  }
  /* fixed pixel box on purpose: no %, no vw, no aspect-ratio.
     nothing about the viewport or image load order can collapse these. */
  .card { width: 360px; }
  .frame {
    position: relative; width: 360px; height: 450px;
    background: #17120e; border: 4px solid transparent; cursor: pointer;
  }
  .card.kept .frame { border-color: #2e6b38; }
  .frame img { display: block; width: 352px; height: 442px; object-fit: contain; }
  .tag {
    position: absolute; left: 8px; top: 8px; padding: 4px 10px;
    font-size: 13px; font-weight: 800; background: rgba(0,0,0,.62); color: #fff;
  }
  .card.kept .tag { background: #2e6b38; }
  .line { padding: 8px 2px 0; font-size: 13px; color: #4a423a; word-break: break-word; }
  .row2 { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .edit-btn {
    font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    border: 1.5px solid #211a12; background: #fff; padding: 4px 10px; margin-top: 6px;
  }
  .edit-btn:hover { background: #211a12; color: #fff; }
  #empty { padding: 40px 22px; color: #6b6259; }

  #editor-panel {
    position: fixed; inset: 0; background: rgba(23,18,14,.72); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #editor-card {
    background: #fff; width: min(760px, 100%); max-height: 90vh; overflow-y: auto;
    border: 3px solid #211a12;
  }
  .ed-head {
    display: flex; align-items: center; padding: 14px 20px; border-bottom: 2px solid #211a12;
    gap: 12px;
  }
  .ed-title { font-weight: 800; font-size: 16px; }
  .ed-body { padding: 20px; display: flex; gap: 22px; flex-wrap: wrap; }
  .ed-preview { width: 280px; height: 350px; background: #17120e; flex-shrink: 0; }
  .ed-preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .ed-fields { flex: 1; min-width: 260px; }
  .ed-label { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
              color: #6b6259; margin-bottom: 6px; display: block; }
  #ed-text {
    width: 100%; font: inherit; font-size: 16px; padding: 10px; border: 2px solid #211a12;
    resize: vertical; min-height: 60px; margin-bottom: 18px;
  }
  .ed-photos {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; max-height: 220px;
    overflow-y: auto; padding: 2px;
  }
  .ed-photo { position: relative; cursor: pointer; border: 3px solid transparent; }
  .ed-photo img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; }
  .ed-photo.picked { border-color: #2e6b38; }
  .ed-foot { padding: 14px 20px; border-top: 2px solid #211a12; display: flex; gap: 10px; justify-content: flex-end; }
  .ed-status { font-size: 13px; color: #6b6259; margin-right: auto; align-self: center; }
  @media (max-width: 820px) {
    .card, .frame { width: 320px; }
    .frame { height: 400px; }
    .frame img { width: 312px; height: 392px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Choose slides</h1>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <button class="act" id="clear">Clear all</button>
  <button class="act" id="close">Done</button>
</header>
<div id="grid"></div>
<div id="empty" hidden>Nothing to show. Open this from a post that has candidates.</div>

<div id="editor-panel" hidden>
  <div id="editor-card">
    <div class="ed-head">
      <span class="ed-title">Edit slide</span>
    </div>
    <div class="ed-body">
      <div class="ed-preview"><img id="ed-preview-img" alt=""></div>
      <div class="ed-fields">
        <span class="ed-label">Line</span>
        <textarea id="ed-text"></textarea>
        <span class="ed-label">Photo</span>
        <div class="ed-photos" id="ed-photos"></div>
      </div>
    </div>
    <div class="ed-foot">
      <span class="ed-status" id="ed-status"></span>
      <button class="act" id="ed-cancel">Cancel</button>
      <button class="act" id="ed-save">Re-render</button>
    </div>
  </div>
</div>

<script>
const qs = new URLSearchParams(location.search);
const VENUE = qs.get("venue"), WEEK = qs.get("week"), ID = qs.get("id");
let slot = null, weekObj = null, poolPhotos = [], editingPath = null, editingPicked = null;
const verBust = {};   // path -> timestamp, so a re-rendered tile shows the new pixels immediately
const lineOverride = {};   // path -> edited line text, so the caption below the tile stays accurate

const mediaUrl = p => "/media/" + VENUE + "/" + WEEK + "/" + p.split("/").map(encodeURIComponent).join("/");
const label = p => p.split("/").pop().replace(/^\d+-/, "").replace(/\.[a-z0-9]+$/i, "").replace(/-/g, " ");

async function load() {
  const r = await fetch("/api/weeks?venue=" + VENUE);
  const j = await r.json();
  weekObj = j.weeks.find(w => w.week_start === WEEK);
  slot = weekObj && weekObj.slots.find(s => s.id === ID);
  if (!slot || !(slot.candidates || []).length) {
    document.getElementById("empty").hidden = false;
    return;
  }
  document.getElementById("title").textContent = slot.title || slot.slot;
  render();
}

function render() {
  const kept = slot.media || [];
  document.getElementById("count").textContent =
    kept.length + " in the carousel, " + slot.candidates.length + " to choose from";
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const path of slot.candidates) {
    const i = kept.indexOf(path);
    const card = document.createElement("div");
    card.className = "card" + (i >= 0 ? " kept" : "");

    const frame = document.createElement("div");
    frame.className = "frame";
    const img = document.createElement("img");
    img.src = mediaUrl(path) + (verBust[path] ? "?t=" + verBust[path] : "");
    img.alt = "";
    frame.appendChild(img);
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = i >= 0 ? String(i + 1) : "out";
    frame.appendChild(tag);
    frame.addEventListener("click", () => toggle(path));
    card.appendChild(frame);

    const line = document.createElement("div");
    line.className = "line";
    line.textContent = lineOverride[path] || label(path);
    card.appendChild(line);

    const editBtn = document.createElement("button");
    editBtn.className = "edit-btn";
    editBtn.textContent = "Edit photo / text";
    editBtn.addEventListener("click", e => { e.stopPropagation(); openEditor(path); });
    card.appendChild(editBtn);

    grid.appendChild(card);
  }
}

async function loadPool() {
  if (poolPhotos.length) return;
  const r = await fetch("/api/kinda-chic-photos?venue=" + VENUE);
  poolPhotos = (await r.json()).photos || [];
}

async function openEditor(path) {
  await loadPool();
  editingPath = path;
  editingPicked = null;
  document.getElementById("ed-text").value = lineOverride[path] || label(path);
  document.getElementById("ed-preview-img").src = mediaUrl(path) + "?t=" + Date.now();
  document.getElementById("ed-status").textContent = "";
  const strip = document.getElementById("ed-photos");
  strip.innerHTML = "";
  for (const f of poolPhotos) {
    const tile = document.createElement("div");
    tile.className = "ed-photo";
    const img = document.createElement("img");
    img.src = `/root/${VENUE}/HUB/refs/H-chic/photos/${f}`;
    img.loading = "eager";
    tile.appendChild(img);
    tile.addEventListener("click", () => {
      editingPicked = f;
      [...strip.children].forEach(c => c.classList.remove("picked"));
      tile.classList.add("picked");
    });
    strip.appendChild(tile);
  }
  document.getElementById("editor-panel").hidden = false;
}

document.getElementById("ed-cancel").addEventListener("click", () => {
  document.getElementById("editor-panel").hidden = true;
});
document.getElementById("editor-panel").addEventListener("click", e => {
  if (e.target.id === "editor-panel") document.getElementById("editor-panel").hidden = true;
});

document.getElementById("ed-save").addEventListener("click", async () => {
  const line = document.getElementById("ed-text").value.trim();
  if (!line) { document.getElementById("ed-status").textContent = "Line can't be empty"; return; }
  if (!editingPicked) { document.getElementById("ed-status").textContent = "Pick a photo first"; return; }
  document.getElementById("ed-status").textContent = "Rendering...";
  const r = await fetch("/api/kinda-chic-render", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ venue: VENUE, week_start: WEEK, photo: editingPicked, line: "kinda chic " + line.replace(/^kinda chic\s*/i, ""), out: editingPath }),
  });
  const j = await r.json();
  if (!j.ok) { document.getElementById("ed-status").textContent = "Failed: " + (j.error || "unknown"); return; }
  verBust[editingPath] = Date.now();
  lineOverride[editingPath] = line;
  document.getElementById("editor-panel").hidden = true;
  render();
});

async function save(next) {
  const r = await fetch("/api/slot", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ venue: VENUE, week_start: WEEK, id: ID, set: { media: next } }),
  });
  const j = await r.json();
  if (j.ok) { slot.media = j.slot.media; render(); }
  else alert("Save failed: " + (j.error || "unknown"));
}

function toggle(path) {
  const kept = slot.media || [];
  save(kept.includes(path) ? kept.filter(p => p !== path) : [...kept, path]);
}

document.getElementById("clear").addEventListener("click", () => {
  if (confirm("Remove all slides from the carousel?")) save([]);
});
document.getElementById("close").addEventListener("click", () => {
  if (history.length > 1) history.back(); else close();
});
load();
</script>
</body>
</html>
